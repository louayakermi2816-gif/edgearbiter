# Whole IoT loop in software: broker + policy service + Node-RED board + virtual ESP32 node.
#   docker compose up --build      then open http://localhost:1880/dashboard
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  api:
    build: .
    environment:
      MQTT_HOST: mosquitto
      MQTT_TOPIC: edgearbiter
      # the MAPPO actors of the measured study (`energy_constrained`, seed 0), shipped in models/demo; actors you train
      # yourself are under models/<study>/<scenario>/ (scripts/run_experiments.py). Without actors the rules answer.
      MODEL_DEVICE: /app/models/demo/mappo_energy_constrained_device.pt
      MODEL_EDGE: /app/models/demo/mappo_energy_constrained_edge.pt
    volumes:
      - ./models:/app/models:ro
    ports: ["8000:8000"]
    depends_on: [mosquitto]

  nodered:
    build: ./node-red
    environment:
      MQTT_HOST: mosquitto
      API_URL: http://api:8000
    ports: ["1880:1880"]
    depends_on: [mosquitto, api]

  virtual-node:                       # software stand-in for the ESP32 node (no hardware needed)
    build: .
    command: ["python", "-m", "edgearbiter.virtual_node", "--broker", "mosquitto", "--interval", "1.0",
              "--scenario", "energy_constrained", "--battery-j", "22.8"]
    depends_on: [mosquitto, nodered]
