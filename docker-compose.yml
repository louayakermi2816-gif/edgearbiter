services:
  api:
    build: .
    environment:
      MQTT_HOST: mosquitto
      MQTT_TOPIC: edgearbiter
      # trained actors (scripts/run_experiments.py); without them the rule-based policies answer
      # MODEL_DEVICE: /app/models/default/mappo_seed0_device.pt
      # MODEL_EDGE: /app/models/default/mappo_seed0_edge.pt
    volumes:
      - ./models:/app/models:ro
    ports: ["8000:8000"]
    depends_on: [mosquitto]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nodered:
    image: nodered/node-red:latest
    ports: ["1880:1880"]
    volumes:
      - ./node-red:/data/projects/edgearbiter:ro
    depends_on: [mosquitto]
