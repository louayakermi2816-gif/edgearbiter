services:
  api:
    build: .
    environment:
      MQTT_HOST: mosquitto
      MQTT_TOPIC: edgearbiter
    ports: ["8000:8000"]
    depends_on: [mosquitto]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nodered:
    image: nodered/node-red:latest
    ports: ["1880:1880"]
    volumes:
      - ./node-red:/data/projects/edgearbiter:ro
    depends_on: [mosquitto]
